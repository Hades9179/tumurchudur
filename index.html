<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Түмэрчүүдүр - Хүүхдийн уншлагын сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Навигаци -->
        <nav class="navbar">
            <div class="nav-content">
                <h1 class="logo">📚 Түмэрчүүдүр</h1>
                <div class="nav-links">
                    <div class="points-badge" id="pointsBadge" style="display:none;">🔵 0</div>
                    <select id="langSelect" class="nav-btn" style="padding:6px 10px; border-radius:12px;">
                        <option value="mn">MN</option>
                        <option value="en">EN</option>
                    </select>
                    <button id="logoutBtn" class="nav-btn" style="display:none;">Гарах</button>
                    <a href="admin.html" class="nav-btn admin-link" id="adminLink" style="display:none;">⚙️ Админ</a>
                </div>
            </div>
        </nav>

        <!-- Нүүр хуудас -->
        <div id="homePage" class="page">
            <div class="welcome-section">
                <h2>Сайн байна уу! 👋</h2>
                <p>Түмэрчүүдүрт тавтай морилно уу - хүүхдүүдэд зориулсан уншлагын платформ</p>
            </div>

            <div class="auth-section">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('login')">Нэвтрэх</button>
                    <button class="tab-btn" onclick="switchTab('register')">Бүртгүүлэх</button>
                </div>

                <!-- Нэвтрэх форм -->
                <div id="loginTab" class="tab-content active">
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>Хэрэглэгчийн нэр:</label>
                            <input type="text" id="loginUsername" placeholder="Хэрэглэгчийн нэрээ оруулна уу" required>
                        </div>
                        <div class="form-group">
                            <label>Нууц үг:</label>
                            <input type="password" id="loginPassword" placeholder="Нууц үгээ оруулна уу" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Нэвтрэх</button>
                    </form>
                </div>

                <!-- Бүртгүүлэх форм -->
                <div id="registerTab" class="tab-content">
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label>Хэрэглэгчийн нэр:</label>
                            <input type="text" id="registerUsername" placeholder="Хэрэглэгчийн нэрээ сонгоно уу" required>
                        </div>
                        <div class="form-group">
                            <label>Нас:</label>
                            <input type="number" id="registerAge" min="10" max="16" placeholder="Таны нас" required>
                        </div>
                        <div class="form-group">
                            <label>Нууц үг:</label>
                            <input type="password" id="registerPassword" placeholder="Нууц үгээ үүсгэнэ үү" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Бүртгүүлэх</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Уншлагын хуудас -->
        <div id="readingPage" class="page" style="display:none;">
            <div class="reading-header">
                <h2 id="storyTitle">Түүх сонгоно уу</h2>
                <p id="userName" class="user-info"></p>
            </div>

            <div class="stories-list" id="storiesList">
                <!-- Story cards loaded from JS -->
            </div>

            <div id="storyContent" class="story-content" style="display:none;">
                <div class="reading-controls">
                    <button class="btn btn-secondary" onclick="toggleAudio()">🔊 Аудио</button>
                    <button class="btn btn-secondary" onclick="changeFontSize('increase')">Том</button>
                    <button class="btn btn-secondary" onclick="changeFontSize('decrease')">Жижиг</button>
                    <button class="btn btn-secondary" onclick="goBackToStories()">Буцах</button>
                </div>

                <div class="text-content" id="textContent">
                    <!-- Текст энд байх болно -->
                </div>

                <div id="storyImageWrap" style="text-align:center; margin:15px 0; display:none;">
                    <img id="storyImage" src="" alt="Story Image" style="max-width:100%; border-radius:8px;" />
                </div>

                <canvas id="cursorCanvas" class="cursor-canvas"></canvas>
                <audio id="audioPlayer"></audio>

                <div class="leaderboard" id="leaderboard">
                    <h3>🏆 Leaderboard</h3>
                    <ul id="leaderboardList"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
